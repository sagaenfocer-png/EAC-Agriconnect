name: Build EAC AgriConnect APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/eac/agriconnect
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.eac.agriconnect'
              compileSdk 34
              defaultConfig {
                  applicationId "com.eac.agriconnect"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="EAC AgriConnect" android:theme="@android:style/Theme.Material.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/eac/agriconnect/MainActivity.kt << 'EOF'
          package com.eac.agriconnect
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "EAC AgriConnect - Welcome!"
                  tv.textSize = 24f
                  setContentView(tv)
              }
          }
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">EAC AgriConnect</string></resources>
          EOF
          echo "wrapper"
      - name: Build APK
        run: |
          chmod +x gradlew || echo "gradlew missing, downloading"
          if [ ! -f gradlew ]; then
            wget https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo '#!/bin/sh' > gradlew
            echo 'exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"' >> gradlew
            chmod +x gradlew
          fi
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EAC-AgriConnect-APK
          path: app/build/outputs/apk/debug/*.apk
