name: Build EAC AgriConnect APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create EAC AgriConnect Project
        run: |
          rm -rf app build.gradle settings.gradle gradle
          mkdir -p app/src/main/java/com/eac/agriconnect
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROP'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROP
          cat > build.gradle << 'BG'
          plugins { id 'com.android.application' version '8.1.4' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }
          BG
          cat > app/build.gradle << 'ABG'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.eac.agriconnect'
            compileSdk 34
            defaultConfig { applicationId "com.eac.agriconnect"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
          }
          ABG
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="EAC AgriConnect" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          MAN
          cat > app/src/main/java/com/eac/agriconnect/MainActivity.kt << 'KT'
          package com.eac.agriconnect
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val tv = TextView(this)
              tv.text = "EAC AgriConnect\nFarmers Market - Uganda"
              tv.textSize = 22f
              tv.setPadding(50,200,50,50)
              setContentView(tv)
            }
          }
          KT
          cat > app/src/main/res/values/strings.xml << 'STR'
          <resources><string name="app_name">EAC AgriConnect</string></resources>
          STR
          curl -sL https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          cat > gradlew << 'GW'
          #!/bin/sh
          exec java -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"
          GW
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EAC-AgriConnect-APK
          path: app/build/outputs/apk/debug/app-debug.apk
